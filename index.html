  <style>
    :root {
      --bg: #eae5d4;
      --ink: #9e6554;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0; min-height: 100%;
      background: var(--bg); color: var(--ink);
      font-family: "Roboto Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
    }
    body {
      min-height: 100dvh;
      display: flex; align-items: center; justify-content: center;
      padding: 2rem 1.5rem;
    }
    main {
      display: flex; flex-direction: column; align-items: center;
      text-align: center; max-width: 32rem;
    }
    .mark { display: block; width: clamp(64px, 14vw, 96px); margin-bottom: 1.6rem; }
    .mark svg { width: 100%; height: auto; display: block; overflow: visible; }
    .mark path { fill: none; stroke: var(--ink); stroke-width: 24; stroke-linecap: butt; }
    .mark path.is-fill { fill: var(--ink); stroke: none; }

    .word { display: flex; flex-direction: column; align-items: center; gap: .5rem; margin: 0; text-transform: uppercase; }
    .word .eyebrow { font-size: clamp(.85rem, 2vw, 1.1rem); font-weight: 500; letter-spacing: .38em; text-indent: .38em; opacity: .85; }
    .word .brand { font-size: clamp(1.9rem, 6vw, 2.8rem); font-weight: 700; letter-spacing: .12em; text-indent: .12em; }

    .msg { margin: 2.4rem 0 0; font-size: .95rem; line-height: 1.7; opacity: .85; }
    .msg strong { font-weight: 600; }

    .contact { margin-top: 1.8rem; display: flex; flex-wrap: wrap; gap: 1.4rem; justify-content: center; font-size: .85rem; }
    .contact a { color: var(--ink); text-decoration: none; border-bottom: 1px solid rgba(158,101,84,.4); padding-bottom: .15rem; transition: border-color .2s ease; }
    .contact a:hover { border-color: var(--ink); }
  </style>
</head>
<body>

  </main>

  <script>
    (function () {
      if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
      var svg = document.querySelector(".mark svg");
      var marks = Array.prototype.slice.call(document.querySelectorAll(".mark path"));
      var vb = svg.viewBox.baseVal;
      var centerX = vb.x + vb.width / 2;
      var DUR = 700, STAGGER = 0.9, REACH = 90;
      var easeOut = function (t) { return 1 - Math.pow(1 - t, 3); };

      marks.forEach(function (m) {
        var box = m.getBBox();
        var cx = box.x + box.width / 2;
        var side = cx < centerX ? -1 : 1;
        var dist = Math.abs(cx - centerX);
        m._from = side * (REACH + dist * 0.35);
        m._delay = dist * STAGGER;
        m.setAttribute("transform", "translate(" + m._from.toFixed(2) + " 0)");
        m.style.opacity = "0";
      });

      var t0 = performance.now();
      function frame(now) {
        var el = now - t0;
        var done = true;
        marks.forEach(function (m) {
          var t = (el - m._delay) / DUR;
          t = t < 0 ? 0 : t > 1 ? 1 : t;
          if (t < 1) done = false;
          var x = m._from * (1 - easeOut(t));
          m.setAttribute("transform", "translate(" + x.toFixed(2) + " 0)");
          m.style.opacity = Math.min(1, t * 2.5).toFixed(3);
        });
        if (!done) requestAnimationFrame(frame);
        else marks.forEach(function (m) { m.removeAttribute("transform"); });
      }
      requestAnimationFrame(frame);
    })();
  </script>
